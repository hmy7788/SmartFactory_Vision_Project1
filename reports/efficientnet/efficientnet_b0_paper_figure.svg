<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">EfficientNet-B0 classification pipeline</title>
  <desc id="desc">A compact scientific figure showing input, training augmentation, an ImageNet-pretrained EfficientNet-B0 with summarized internal stages, and four-class output.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .block-title { font-size: 21px; font-weight: 700; fill: #111827; }
      .model-title { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
      .stage-title { font-size: 14px; font-weight: 700; fill: #111827; }
      .body { font-size: 15px; font-weight: 400; fill: #1F2937; }
      .small { font-size: 13px; font-weight: 400; fill: #4B5563; }
      .tiny { font-size: 12px; font-weight: 400; fill: #4B5563; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="800" fill="#FFFFFF"/>

  <!-- INPUT -->
  <g class="font">
    <rect x="40" y="220" width="155" height="360" rx="7" fill="#F9FAFB" stroke="#374151" stroke-width="1.5"/>
    <rect x="40" y="220" width="155" height="52" rx="7" fill="#E5E7EB"/>
    <path d="M40 265h155v7H40z" fill="#E5E7EB"/>
    <text x="117.5" y="253" text-anchor="middle" class="block-title">Input</text>
    <rect x="70" y="307" width="95" height="130" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
    <path d="M91 331h53l7 19v65c0 8-6 14-14 14h-39c-8 0-14-6-14-14v-65z" fill="#64748B"/>
    <rect x="100" y="318" width="35" height="18" rx="3" fill="#475569"/>
    <text x="117.5" y="478" text-anchor="middle" class="body">RGB image</text>
    <text x="117.5" y="509" text-anchor="middle" class="block-title">224 × 224 × 3</text>
    <text x="117.5" y="542" text-anchor="middle" class="small">EXIF orientation</text>
    <text x="117.5" y="561" text-anchor="middle" class="small">correction</text>
  </g>

  <!-- AUGMENTATION -->
  <g class="font">
    <rect x="245" y="190" width="210" height="420" rx="7" fill="#F7FAFC" stroke="#46647A" stroke-width="1.5"/>
    <rect x="245" y="190" width="210" height="52" rx="7" fill="#E4EDF3"/>
    <path d="M245 235h210v7H245z" fill="#E4EDF3"/>
    <text x="350" y="223" text-anchor="middle" class="block-title">Augmentation</text>
    <rect x="281" y="279" width="138" height="44" rx="4" fill="#FFFFFF" stroke="#A8BAC7"/>
    <text x="350" y="306" text-anchor="middle" class="body">Random resized crop</text>
    <rect x="281" y="337" width="138" height="44" rx="4" fill="#FFFFFF" stroke="#A8BAC7"/>
    <text x="350" y="364" text-anchor="middle" class="body">Horizontal flip</text>
    <rect x="281" y="395" width="138" height="44" rx="4" fill="#FFFFFF" stroke="#A8BAC7"/>
    <text x="350" y="422" text-anchor="middle" class="body">Rotation ±10°</text>
    <rect x="281" y="453" width="138" height="44" rx="4" fill="#FFFFFF" stroke="#A8BAC7"/>
    <text x="350" y="480" text-anchor="middle" class="body">Color jitter</text>
    <rect x="294" y="530" width="112" height="32" rx="16" fill="#E4EDF3"/>
    <text x="350" y="551" text-anchor="middle" class="small">training only</text>
    <text x="350" y="588" text-anchor="middle" class="tiny">Evaluation: resize + center crop</text>
  </g>

  <!-- MODEL -->
  <g class="font">
    <rect x="510" y="90" width="635" height="620" rx="9" fill="#FFFFFF" stroke="#294F6D" stroke-width="1.8"/>
    <rect x="510" y="90" width="635" height="72" rx="9" fill="#315B7D"/>
    <path d="M510 151h635v11H510z" fill="#315B7D"/>
    <text x="827.5" y="123" text-anchor="middle" class="model-title">ImageNet-pretrained EfficientNet-B0</text>
    <text x="827.5" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#EAF2F8">end-to-end fine-tuning</text>

    <!-- compact stage flow, row 1 -->
    <rect x="540" y="202" width="130" height="112" rx="5" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="605" y="230" text-anchor="middle" class="stage-title">Stem</text>
    <text x="605" y="257" text-anchor="middle" class="small">Conv 3×3, s2</text>
    <text x="605" y="282" text-anchor="middle" class="body">112² × 32</text>
    <text x="605" y="301" text-anchor="middle" class="tiny">Conv–BN–SiLU</text>
    <rect x="688" y="202" width="130" height="112" rx="5" fill="#EFF6FF" stroke="#527A99"/>
    <text x="753" y="230" text-anchor="middle" class="stage-title">Stage 1</text>
    <text x="753" y="257" text-anchor="middle" class="small">MBConv1 k3 ×1</text>
    <text x="753" y="282" text-anchor="middle" class="body">112² × 16</text>
    <text x="753" y="301" text-anchor="middle" class="tiny">stride 1</text>
    <rect x="836" y="202" width="130" height="112" rx="5" fill="#EFF6FF" stroke="#527A99"/>
    <text x="901" y="230" text-anchor="middle" class="stage-title">Stage 2</text>
    <text x="901" y="257" text-anchor="middle" class="small">MBConv6 k3 ×2</text>
    <text x="901" y="282" text-anchor="middle" class="body">56² × 24</text>
    <text x="901" y="301" text-anchor="middle" class="tiny">stride 2</text>
    <rect x="984" y="202" width="130" height="112" rx="5" fill="#EDF7F5" stroke="#55827C"/>
    <text x="1049" y="230" text-anchor="middle" class="stage-title">Stage 3</text>
    <text x="1049" y="257" text-anchor="middle" class="small">MBConv6 k5 ×2</text>
    <text x="1049" y="282" text-anchor="middle" class="body">28² × 40</text>
    <text x="1049" y="301" text-anchor="middle" class="tiny">stride 2</text>

    <path d="M1049 314 V346 H605 V357" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- compact stage flow, row 2 -->
    <rect x="540" y="370" width="130" height="112" rx="5" fill="#EDF7F5" stroke="#55827C"/>
    <text x="605" y="398" text-anchor="middle" class="stage-title">Stage 4</text>
    <text x="605" y="425" text-anchor="middle" class="small">MBConv6 k3 ×3</text>
    <text x="605" y="450" text-anchor="middle" class="body">14² × 80</text>
    <text x="605" y="469" text-anchor="middle" class="tiny">stride 2</text>
    <rect x="688" y="370" width="130" height="112" rx="5" fill="#F3F0F8" stroke="#79698B"/>
    <text x="753" y="398" text-anchor="middle" class="stage-title">Stage 5</text>
    <text x="753" y="425" text-anchor="middle" class="small">MBConv6 k5 ×3</text>
    <text x="753" y="450" text-anchor="middle" class="body">14² × 112</text>
    <text x="753" y="469" text-anchor="middle" class="tiny">stride 1</text>
    <rect x="836" y="370" width="130" height="112" rx="5" fill="#F3F0F8" stroke="#79698B"/>
    <text x="901" y="398" text-anchor="middle" class="stage-title">Stage 6</text>
    <text x="901" y="425" text-anchor="middle" class="small">MBConv6 k5 ×4</text>
    <text x="901" y="450" text-anchor="middle" class="body">7² × 192</text>
    <text x="901" y="469" text-anchor="middle" class="tiny">stride 2</text>
    <rect x="984" y="370" width="130" height="112" rx="5" fill="#F3F0F8" stroke="#79698B"/>
    <text x="1049" y="398" text-anchor="middle" class="stage-title">Stage 7</text>
    <text x="1049" y="425" text-anchor="middle" class="small">MBConv6 k3 ×1</text>
    <text x="1049" y="450" text-anchor="middle" class="body">7² × 320</text>
    <text x="1049" y="469" text-anchor="middle" class="tiny">stride 1</text>

    <path d="M670 258 H676" class="arrow"/>
    <path d="M818 258 H824" class="arrow"/>
    <path d="M966 258 H972" class="arrow"/>
    <path d="M670 426 H676" class="arrow"/>
    <path d="M818 426 H824" class="arrow"/>
    <path d="M966 426 H972" class="arrow"/>

    <!-- feature head -->
    <path d="M1049 482 V512 H827 V520" class="arrow"/>
    <rect x="618" y="529" width="419" height="105" rx="5" fill="#F7F8FA" stroke="#6B7280" stroke-width="1.2"/>
    <text x="827.5" y="560" text-anchor="middle" class="stage-title">Feature head</text>
    <text x="827.5" y="590" text-anchor="middle" class="body">1×1 Conv (1280) → Global Average Pooling → Dropout (p = 0.2)</text>
    <text x="827.5" y="617" text-anchor="middle" class="small">1280-dimensional feature vector</text>
    <text x="827.5" y="678" text-anchor="middle" class="small">spatial resolution ↓      semantic channel capacity ↑</text>
  </g>

  <!-- OUTPUT -->
  <g class="font">
    <rect x="1200" y="190" width="165" height="420" rx="7" fill="#F9FAFB" stroke="#374151" stroke-width="1.5"/>
    <rect x="1200" y="190" width="165" height="52" rx="7" fill="#E8E3EE"/>
    <path d="M1200 235h165v7h-165z" fill="#E8E3EE"/>
    <text x="1282.5" y="223" text-anchor="middle" class="block-title">Output</text>
    <text x="1282.5" y="282" text-anchor="middle" class="stage-title">Linear 1280 → 4</text>
    <text x="1282.5" y="306" text-anchor="middle" class="small">Softmax probabilities</text>
    <rect x="1223" y="344" width="119" height="44" rx="4" fill="#FFFFFF" stroke="#9B8AAA"/>
    <text x="1282.5" y="372" text-anchor="middle" class="body">mug</text>
    <rect x="1223" y="402" width="119" height="44" rx="4" fill="#FFFFFF" stroke="#9B8AAA"/>
    <text x="1282.5" y="430" text-anchor="middle" class="body">straight</text>
    <rect x="1223" y="460" width="119" height="44" rx="4" fill="#FFFFFF" stroke="#9B8AAA"/>
    <text x="1282.5" y="488" text-anchor="middle" class="small">taper_smooth</text>
    <rect x="1223" y="518" width="119" height="44" rx="4" fill="#FFFFFF" stroke="#9B8AAA"/>
    <text x="1282.5" y="546" text-anchor="middle" class="small">taper_step</text>
  </g>

  <!-- pipeline arrows -->
  <path d="M195 400 H231" class="arrow"/>
  <path d="M455 400 H496" class="arrow"/>
  <path d="M1145 400 H1186" class="arrow"/>

  <!-- concise note -->
  <g class="font">
    <line x1="40" y1="744" x2="1365" y2="744" stroke="#D1D5DB" stroke-width="1"/>
    <text x="40" y="774" class="small">Training data: crawled images only</text>
    <text x="1365" y="774" text-anchor="end" class="small">Classifier adapted for four target classes</text>
  </g>
</svg>
