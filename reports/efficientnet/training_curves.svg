    <circle cx="1068.0" cy="84.0" r="3.1" fill="#178073"/>
    <text x="864" y="396" text-anchor="middle" class="label">Epoch</text>
    <text x="608" y="207.5" transform="rotate(-90 608 207.5)" text-anchor="middle" class="label">Accuracy</text>
    <text x="1068" y="93.0" text-anchor="end" class="end" fill="#178073">Final 99%</text></g>
  <text x="550" y="429" text-anchor="middle" class="note">Final epoch model · Train set only · Test metrics are reported separately</text>
</svg>
