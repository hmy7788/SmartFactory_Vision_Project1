<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Training loss and accuracy by epoch</title>
  <desc id="desc">Two line charts show training loss decreasing from 1.15 to 0.0254 and training accuracy increasing from 55.17 percent to 99.22 percent over 15 epochs. No validation curve is shown because this experiment did not use a validation set.</desc>
  <style>.panel{font:700 21px Arial,sans-serif;fill:#111827}.label{font:15px Arial,sans-serif;fill:#374151}.tick{font:13px Arial,sans-serif;fill:#4B5563}.end{font:700 13px Arial,sans-serif}.note{font:12px Arial,sans-serif;fill:#6B7280}</style>
  <rect width="1100" height="440" fill="#FFFFFF"/>
  <g><text x="296" y="48" text-anchor="middle" class="panel">Training loss</text>
    <line x1="92" y1="335.0" x2="500" y2="335.0" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="340.0" text-anchor="end" class="tick">0</text>
    <line x1="92" y1="271.3" x2="500" y2="271.3" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="276.3" text-anchor="end" class="tick">0.30</text>
    <line x1="92" y1="207.5" x2="500" y2="207.5" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="212.5" text-anchor="end" class="tick">0.60</text>
    <line x1="92" y1="143.8" x2="500" y2="143.8" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="148.8" text-anchor="end" class="tick">0.90</text>
    <line x1="92" y1="80.0" x2="500" y2="80.0" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="85.0" text-anchor="end" class="tick">1.20</text>
    <line x1="92" y1="335" x2="500" y2="335" stroke="#6B7280" stroke-width="1.3"/>
    <line x1="92.0" y1="335" x2="92.0" y2="341" stroke="#6B7280"/><text x="92.0" y="362" text-anchor="middle" class="tick">1</text>
    <line x1="208.6" y1="335" x2="208.6" y2="341" stroke="#6B7280"/><text x="208.6" y="362" text-anchor="middle" class="tick">5</text>
    <line x1="354.3" y1="335" x2="354.3" y2="341" stroke="#6B7280"/><text x="354.3" y="362" text-anchor="middle" class="tick">10</text>
    <line x1="500.0" y1="335" x2="500.0" y2="341" stroke="#6B7280"/><text x="500.0" y="362" text-anchor="middle" class="tick">15</text>
    <polyline points="92.0,90.6 121.1,227.4 150.3,293.2 179.4,306.5 208.6,318.7 237.7,324.2 266.9,326.7 296.0,328.0 325.1,329.5 354.3,326.7 383.4,322.7 412.6,325.1 441.7,330.6 470.9,327.3 500.0,329.6" fill="none" stroke="#315B7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92.0" cy="90.6" r="3.1" fill="#315B7D"/>
    <circle cx="121.1" cy="227.4" r="3.1" fill="#315B7D"/>
    <circle cx="150.3" cy="293.2" r="3.1" fill="#315B7D"/>
