    <text x="40" y="207.5" transform="rotate(-90 40 207.5)" text-anchor="middle" class="label">Cross-entropy loss</text>
    <text x="500" y="317.6" text-anchor="end" class="end" fill="#315B7D">Final 0.03</text></g>
  <g><text x="864" y="48" text-anchor="middle" class="panel">Training accuracy</text>
