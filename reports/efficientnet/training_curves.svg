    <circle cx="864.0" cy="84.0" r="3.1" fill="#178073"/>
    <circle cx="893.1" cy="84.0" r="3.1" fill="#178073"/>
    <circle cx="922.3" cy="86.0" r="3.1" fill="#178073"/>
    <circle cx="951.4" cy="88.9" r="3.1" fill="#178073"/>
    <circle cx="980.6" cy="84.0" r="3.1" fill="#178073"/>
