    <circle cx="412.6" cy="325.1" r="3.1" fill="#315B7D"/>
    <circle cx="441.7" cy="330.6" r="3.1" fill="#315B7D"/>
    <circle cx="470.9" cy="327.3" r="3.1" fill="#315B7D"/>
    <circle cx="500.0" cy="329.6" r="3.1" fill="#315B7D"/>
