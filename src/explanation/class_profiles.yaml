# 클래스별 해설 — 대시보드가 판정 결과 아래에 띄우는 내용.
#
# 왜 코드가 아니라 데이터로 두는가
#   1) 문구를 고치려고 app.py를 건드릴 이유가 없다. 파일만 저장하면 화면이 바뀐다.
#   2) 발표 자료·보고서가 같은 원본을 쓴다. 화면과 문서가 어긋나지 않는다.
#   3) 클래스를 추가하면 여기 한 항목만 늘리면 된다.
#
# 키는 config.yaml의 classes와 정확히 같아야 한다. 다르면 대시보드가 경고를 띄운다.
# rule은 라벨링 기준(docs/data_contract.md)과 같은 문장을 쓴다 — 판정 근거를 화면에서
# 바로 대조할 수 있어야 하기 때문이다.

straight:
  title: Straight
  ko: 원통형 스트레이트
  rule: 아래 지름이 위 지름의 95% 이상
  design: >
    상단부터 하단까지 직경 변화가 없는 일정한 원통형 실루엣. 금속 딥드로잉(Deep Drawing)과
    롤링 공정에서 치수 공차가 가장 적어 재료 손실이 적은, 가장 경제적인 형태다.
  movement: >
    바우하우스의 "형태는 기능을 따른다(Form follows function)"와 현대 미니멀리즘의
    "Less is more" 기조가 투영된 형태. 군더더기 장식을 배제해 '심플 이즈 더 베스트'
    취향을 충족한다.
  products: >
    킨토(Kinto) 트래블 텀블러와 미르(MiiR) 슬림 보틀이 이 원통형 구조를 정착시켰다.
    그래픽 인쇄와 브랜딩 협업이 가장 쉬워 OEM 굿즈·카페 PB 상품의 표준이 되었다.

taper_smooth:
  title: Smooth Taper
  ko: 완만한 테이퍼형
  rule: 꺾임점 없이 매끄럽게 좁아짐
  design: >
    상단 림(Rim)에서 하단 베이스로 내려갈수록 직경이 완만하고 매끄럽게 줄어드는 원뿔대
    형태. 일회용 종이컵의 인간공학적 비례를 스테인리스 진공 구조로 치환한 디자인이다.
  movement: >
    일상적인 카페 문화와 유선형 디자인 감성의 결합. 그립감을 극대화하고, 금속 특유의
    차가운 인상을 유려한 곡선과 파스텔톤 컬러 코팅으로 완화한다.
  products: >
    스웰(S'well) 텀블러 라인업과 하이드로플라스크(Hydro Flask) 컵 시리즈가 대표적이다.
    테이크아웃 컵을 대체하는 친환경 라이프스타일 붐을 타고 오피스용 텀블러의 전형적인
    규격으로 자리매김했다.

taper_step:
  title: Step Taper
  ko: 계단식 테이퍼형
  rule: 뚜렷한 꺾임이 1회 이상
  design: >
    상부는 30~40oz 수준의 대용량을 확보하기 위해 넓은 직경을 유지하고, 하단부에서
    급격하게 단차(Step)를 두어 좁아지는 구조.
  movement: >
    북미 자동차 중심 문화와 아웃도어 실용주의의 결합. 차량 표준 컵홀더 직경(약 7.5cm
    내외)에 맞추면서 적재 용량을 극대화하려고, 엔지니어링 관점에서 단차를 설계했다.
  products: >
    스탠리 퀜처(Stanley Quencher)가 틱톡을 비롯한 SNS에서 폭발적 인기를 끌며 트렌드를
    주도했다. 이후 스타벅스 콜라보를 비롯해 다수 보냉병 제조사가 이 계단식 하단 구조를
    표준처럼 모방해 대용량 드라이브용 시장을 형성했다.

mug:
  title: Mug
  ko: 손잡이형 머그
  rule: 높이가 지름의 1.5배 이하
  design: >
    전통적인 도자기 머그잔의 비례에 견고한 금속 핸들을 용접 또는 체결한 형태. 데스크나
    캠핑 테이블처럼 고정된 평면에서의 안정적인 거치를 목적으로 설계된다.
  movement: >
    아날로그적 음미 문화와 인더스트리얼 Rugged 디자인의 결합. 이동 중 흔들림을 견디는
    보틀형과 달리, 일상 휴식 공간(데스크테리어·홈카페)에서 클래식한 사용 경험을 유지한다.
  products: >
    예티(YETI) 램블러 머그와 스탠리 클래식 캠프 머그가 헤비 듀티(Heavy-duty) 감성으로
    성공했고, 이후 사무실·아웃도어용 진공 단열 머그의 표준 형태가 되었다.

# 판정 우선순위 — 라벨링과 화면 해설이 같은 규칙을 따라야 한다.
# 실루엣이 손잡이보다 우선한다: 손잡이 달린 테이퍼 텀블러는 mug가 아니라 taper_smooth다.
# 뚜껑 경계선은 단차로 보지 않는다.
